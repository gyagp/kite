# Reproduce WebGFX's sensitive output/down/LM-head INT8 policy with current GenAI.
# Retain the current exporter's dense recurrent gates. A candidate, not yet recommended.
backend = "genai"
source = "../models/qwen35-4b"
source_kind = "local"
output = "../artifacts/qwen35-4b-webgfx-policy-v3"
precision = "int4"
activation_dtype = "fp16"
block_size = 32
graph_capture = true

[genai_options]
exclude_mtp = true
prune_lm_head = true
fuse_mlp_gate_up = false

[genai_config.target_options.quant_config]
io_dtype = "fp16"

[genai_config.target_options.quant_config.weights]
type = "int4"
block_size = 32
symmetric = true
method = "rtn"
accuracy_level = 4

[[genai_config.target_options.quant_config.weights.overrides]]
match = {preset = "last_matmul"}
type = "int8"

[[genai_config.target_options.quant_config.weights.overrides]]
match = {name = "/model/layers.0/linear_attn/out_proj/MatMul"}
type = "int8"

[[genai_config.target_options.quant_config.weights.overrides]]
match = {name = "/model/layers.0/mlp/down_proj/MatMul"}
type = "int8"

