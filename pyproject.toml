[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kite-local"
version = "0.2.0"
description = "Local inference and model authoring with ONNX Runtime WebGPU"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["onnx>=1.18,<2"]

[project.optional-dependencies]
genai = [
  "onnxruntime-genai>=0.17.1,<0.18",
  "torch>=2.6",
  "transformers>=5.2,<6",
  "onnx-ir",
  "onnxscript",
  "accelerate",
  "safetensors",
]
mobius = ["mobius-onnx @ git+https://github.com/onnxruntime/mobius.git@88f7d045388ccdcd98e8a23f4abcbcdfd39f65e6"]
validation = ["onnxruntime>=1.22,<2"]
native = ["onnxruntime>=1.31,<2", "onnxruntime-genai==0.17.1", "onnxruntime-ep-webgpu==0.4.0", "psutil>=6"]
ui-test = ["playwright>=1.50"]

[project.scripts]
kite = "backend.server:main"
evo = "evo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend", "evo"]

[tool.hatch.build.targets.wheel.force-include]
"evo_resources" = "evo_resources"
"demo" = "demo"
"dist" = "dist"

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
